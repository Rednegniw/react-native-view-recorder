name: Daily Analytics Report

on:
  schedule:
    # 09:30 UTC — offset from number-flow-react-native (09:00)
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Send Analytics Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Restore snapshot cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/analytics-snapshot.json
          # Caches are immutable, so each run saves under a unique key and
          # restore picks the most recent one via the prefix match.
          key: analytics-snapshot-${{ github.run_id }}
          restore-keys: analytics-snapshot-

      - name: Run analytics script
        env:
          ANALYTICS_PACKAGE_NAME: react-native-view-recorder
          ANALYTICS_PROJECT_LABEL: react-native-view-recorder
          ANALYTICS_REPO: Rednegniw/react-native-view-recorder
          ANALYTICS_DOCS_HOST: react-native-view-recorder.awingender.com
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANALYTICS_GITHUB_TOKEN: ${{ secrets.ANALYTICS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          SNAPSHOT_PATH: /tmp/analytics-snapshot.json
        run: bun run .github/scripts/daily-analytics.ts

      - name: Save snapshot cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/analytics-snapshot.json
          key: analytics-snapshot-${{ github.run_id }}
